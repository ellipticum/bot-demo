name: PlanetSim exact Rust toolchain

on:
  push:
    branches:
      - automation/planetsim-toolchain
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup set profile minimal
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
          rustc -Vv
          cargo -V

      - name: Bundle standalone toolchain
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$(rustc +1.91.0 --print sysroot)"
          mkdir -p artifact
          tar -C "$SYSROOT" -I 'zstd -10 -T0' -cf artifact/rust-1.91.0-x86_64-unknown-linux-gnu.tar.zst .
          sha256sum artifact/rust-1.91.0-x86_64-unknown-linux-gnu.tar.zst > artifact/SHA256SUMS
          rustc -Vv > artifact/RUSTC_VERSION
          cargo -V > artifact/CARGO_VERSION
          du -h artifact/*

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: planetsim-rust-1.91.0-x86_64-unknown-linux-gnu
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
